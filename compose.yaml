name: taskquest-ai
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: taskquest-ai:local
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8000"
    environment:
      DATABASE_PATH: /app/data/taskquest.db
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    volumes:
      - taskquest-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
volumes:
  taskquest-data:
